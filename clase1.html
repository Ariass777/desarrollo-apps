<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Sencilla</title>
    <style>
        /* Estilos generales para centrar la calculadora */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        /* Diseño del contenedor principal */
        .calculadora {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 260px;
        }

        /* Diseño de la pantalla */
        .pantalla {
            width: 100%;
            height: 50px;
            background-color: #e9ecef;
            border: none;
            border-radius: 8px;
            text-align: right;
            font-size: 24px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            color: #333;
        }

        /* Cuadrícula para los botones */
        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* Diseño de los botones */
        button {
            padding: 15px 0;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #e2e6ea;
        }

        /* Colores especiales para operadores y botón de limpiar */
        .operador {
            background-color: #4dabf7;
            color: white;
            font-weight: bold;
        }

        .operador:hover {
            background-color: #3bc9db;
        }

        .limpiar {
            background-color: #fa5252;
            color: white;
            grid-column: span 4;
            font-weight: bold;
        }

        .limpiar:hover {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <!-- Pantalla de la calculadora -->
        <input type="text" id="pantalla" class="pantalla" disabled>

        <!-- Botones -->
        <div class="botones">
            <button class="limpiar" onclick="limpiarPantalla()">C</button>
            
            <button onclick="agregarValor('7')">7</button>
            <button onclick="agregarValor('8')">8</button>
            <button onclick="agregarValor('9')">9</button>
            <button class="operador" onclick="agregarValor('/')">÷</button>
            
            <button onclick="agregarValor('4')">4</button>
            <button onclick="agregarValor('5')">5</button>
            <button onclick="agregarValor('6')">6</button>
            <button class="operador" onclick="agregarValor('*')">×</button>
            
            <button onclick="agregarValor('1')">1</button>
            <button onclick="agregarValor('2')">2</button>
            <button onclick="agregarValor('3')">3</button>
            <button class="operador" onclick="agregarValor('-')">-</button>
            
            <button onclick="agregarValor('0')">0</button>
            <button onclick="agregarValor('.')">.</button>
            <button class="operador" onclick="calcular()">=</button>
            <button class="operador" onclick="agregarValor('+')">+</button>
        </div>
    </div>

    <script>
        // Obtenemos el elemento de la pantalla
        const pantalla = document.getElementById('pantalla');

        // Función para añadir números o símbolos a la pantalla
        function agregarValor(valor) {
            pantalla.value += valor;
        }

        // Función para borrar todo el contenido
        function limpiarPantalla() {
            pantalla.value = '';
        }

        // Función para resolver la operación
        function calcular() {
            try {
                // eval() toma el texto de la pantalla y lo resuelve matemáticamente
                pantalla.value = eval(pantalla.value);
            } catch (error) {
                // Si hay un error (ej. 5++5), mostramos 'Error'
                pantalla.value = 'Error';
            }
        }
    </script>

</body>
</html>
